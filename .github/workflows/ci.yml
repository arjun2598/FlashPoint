name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC / Debug + sanitizers
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: dev
          - name: Linux / GCC / Release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: release
          - name: Linux / Clang / Debug + sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            preset: dev
          - name: macOS / AppleClang / Debug + sanitizers
            os: macos-latest
            cc: clang
            cxx: clang++
            preset: dev
          - name: macOS / AppleClang / Release
            os: macos-latest
            cc: clang
            cxx: clang++
            preset: release

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # The release preset also builds the benchmark targets. They are never run
      # here: a shared runner cannot produce a number worth asserting on, but
      # compiling them stops them bit-rotting against API changes (DD-040).
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pinned clang-format
        run: pip install "clang-format==$(cat .clang-format-version)"

      - name: Check formatting
        run: |
          clang-format --version
          # git ls-files restricts the check to tracked sources, so build output
          # can never be scanned. .hpp.in templates are excluded because their
          # @VAR@ placeholders are not valid C++ tokens.
          files=$(git ls-files '*.cpp' '*.hpp')
          if [ -z "$files" ]; then
            echo "::error::No source files matched; the format gate would pass vacuously."
            exit 1
          fi
          echo "$files" | xargs clang-format --dry-run --Werror
