name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC / Debug + sanitizers
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: dev
          - name: Linux / GCC / Release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            preset: release
          - name: Linux / Clang / Debug + sanitizers
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            preset: dev
          - name: macOS / AppleClang / Debug + sanitizers
            os: macos-latest
            cc: clang
            cxx: clang++
            preset: dev
          - name: macOS / AppleClang / Release
            os: macos-latest
            cc: clang
            cxx: clang++
            preset: release

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          clang-format --version
          # .hpp.in templates are excluded: the @VAR@ placeholders are not
          # valid C++ tokens and clang-format mangles them.
          find include src tests \
            \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
